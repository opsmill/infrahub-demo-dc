---
name: CI
# yamllint disable rule:truthy rule:line-length
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  files-changed:
    name: Detect which file has changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      documentation: ${{ steps.changes.outputs.documentation_all }}
      python: ${{ steps.changes.outputs.python_all }}
      yaml: ${{ steps.changes.outputs.yaml_all }}
      markdown: ${{ steps.changes.outputs.markdown_all }}
      dependencies: ${{ steps.changes.outputs.dependencies_all }}
      integration_scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
      - name: Check for file changes
        uses: opsmill/paths-filter@v3.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml
      - name: Decide how much of the integration suite to run
        id: scope
        # The extended tier adds the second vendor design, the POP and segment services, day-two
        # operations and the conflict workflow. It roughly triples the integration runtime, so it runs
        # only when a pull request is labelled `full-integration`.
        #
        # It is opt-in rather than automatic on dependency bumps and merges to main because it
        # currently cannot pass: Infrahub intermittently fails to resolve a member of its own
        # CoreGeneratorGroup / CoreGraphQLQueryGroup, which fails any generator running at the time.
        # It surfaces as an HTTP 500 on `CoreGeneratorGroup(...).members` with a bare node id as the
        # message, and it is not something this repository can fix. Running the tier automatically
        # would leave main permanently red and teach everyone to ignore it.
        #
        # Restore the automatic triggers once that is fixed upstream, by treating a dependency change
        # (`steps.changes.outputs.dependencies_all`) or a push to main as `full` again. That is the
        # behaviour this gate was written for: a version bump is the change most likely to break a
        # workflow and the least likely to be caught by reading the diff.
        run: |
          if [ "${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-integration') }}" = "true" ]; then
            echo "scope=full" >> $GITHUB_OUTPUT
          else
            echo "scope=core" >> $GITHUB_OUTPUT
          fi
          echo "Integration scope selected -> $(tail -n1 $GITHUB_OUTPUT)"

  python-lint:
    if: needs.files-changed.outputs.python == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
      - run: uv sync
      - name: Check code formatting
        run: |
          uv run ruff format --check --diff
          uv run ruff check --select I .
      - name: Run linters
        run: uv run ruff check
      - name: Run type checks
        run: uv run mypy .

  yaml-lint:
    if: needs.files-changed.outputs.yaml == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
      - run: uv sync
      - name: Run yamllint
        run: uv run yamllint -s .

  markdown-lint:
    if: needs.files-changed.outputs.markdown == 'true'
    needs: ["files-changed"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run rumdl
        uses: rvben/rumdl@v0
        with:
          report-type: annotations

  integration-test:
    name: "integration-test (${{ needs.files-changed.outputs.integration_scope }})"
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: ["files-changed", "python-lint", "yaml-lint", "markdown-lint"]
    runs-on:
      group: "huge-runners"
    # The whole integration suite shares a single Infrahub deployment, so the extended tier is not a
    # separate stack -- just more workflows driven against the same one.
    timeout-minutes: ${{ needs.files-changed.outputs.integration_scope == 'full' && 180 || 75 }}
    env:
      INFRAHUB_DB_TYPE: neo4j
      INFRAHUB_TESTING_LOG_LEVEL: INFO
      # Neither INFRAHUB_API_TOKEN nor INFRAHUB_TIMEOUT is set here, on purpose. Both used to be load-
      # bearing by accident: `Config` reads them from the environment, so the suite authenticated and
      # survived a slow schema load only on a runner that exported them, and failed everywhere else.
      # Both are now passed explicitly (see the `infrahub_api_token` fixture and
      # `constants.CLIENT_TIMEOUT`), so the suite behaves the same on a laptop as it does here.
    steps:
      - uses: actions/checkout@v6
      - name: Install tini
        run: "apt-get update && apt-get install -y tini"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
      - run: uv sync
      - name: Set environment variables
        run: |
          RUNNER_NAME=$(echo "${{ runner.name }}" | grep -o 'ghrunner[0-9]\+' | sed 's/ghrunner\([0-9]\+\)/ghrunner_\1/')
          echo "PYTEST_DEBUG_TEMPROOT=/var/lib/github/${RUNNER_NAME}/_temp" >> $GITHUB_ENV
      - name: Run tests (core workflows only)
        if: needs.files-changed.outputs.integration_scope != 'full'
        run: exec tini -s -g -- uv run pytest tests/ -m "not extended"
      - name: Run tests (all workflows)
        if: needs.files-changed.outputs.integration_scope == 'full'
        run: exec tini -s -g -- uv run pytest tests/

  documentation:
    defaults:
      run:
        working-directory: ./docs
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.files-changed.outputs.documentation == 'true'
    needs: ["files-changed", "yaml-lint", "python-lint", "markdown-lint"]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install Node dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
      - run: uv sync
        working-directory: ./
      - name: Build docs website
        run: uv run invoke docs


  validate-documentation-style:
    if: |
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: ["files-changed", "yaml-lint", "python-lint", "markdown-lint"]
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    env:
      VALE_VERSION: "3.13.0"
    steps:
      - uses: "actions/checkout@v6"
        with:
          submodules: true

      # The official GitHub Action for Vale doesn't work, installing manually instead:
      # https://github.com/errata-ai/vale-action/issues/103
      - name: Download Vale
        run: |
          curl -sL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -o vale.tar.gz
          tar -xzf vale.tar.gz
      - name: "Validate documentation style"
        run: ./vale $(find ./docs/docs -type f \( -name "*.mdx" -o -name "*.md" \) )
