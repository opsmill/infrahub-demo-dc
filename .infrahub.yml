---
jinja2_transforms:
  # Containerlab
  - name: topology_clab
    description: Template to generate a containerlab topology
    query: topology_simulator
    template_path: templates/clab_topology.j2
  # Proxmox
  #
  # Every per-hypervisor provisioning template `{% include %}`s the shared
  # user-data partial, which Infrahub cannot see from `template_path` alone.
  # Without the `watch` entry, editing the partial leaves all four provisioning
  # artifacts rendered from the old copy.
  - name: proxmox_vm_config
    description: Template to generate a Proxmox VE VM provisioning script
    query: vm_config
    template_path: templates/configs/proxmox_vm.j2
    watch:
      files:
        - templates/configs/partials/vm_userdata.j2
  - name: vm_userdata
    description: Cloud-init / cloudbase-init user-data for a virtual machine
    query: vm_config
    template_path: templates/configs/partials/vm_userdata.j2
  # KVM
  - name: kvm_vm_config
    description: Template to generate a KVM/libvirt VM provisioning script
    query: vm_config
    template_path: templates/configs/kvm_vm.j2
    watch:
      files:
        - templates/configs/partials/vm_userdata.j2
  # Hyper-V
  - name: hyperv_vm_config
    description: Template to generate a Microsoft Hyper-V VM provisioning script
    query: vm_config
    template_path: templates/configs/hyperv_vm.j2
    watch:
      files:
        - templates/configs/partials/vm_userdata.j2
  # ESXi
  - name: esxi_vm_config
    description: Template to generate a VMware ESXi VM provisioning script
    query: vm_config
    template_path: templates/configs/esxi_vm.j2
    watch:
      files:
        - templates/configs/partials/vm_userdata.j2

artifact_definitions:
  # Cisco
  - name: edge_config
    artifact_name: edge
    content_type: text/plain
    targets: edges
    transformation: edge
    parameters:
      device: name__value
  - name: leaf_config
    artifact_name: leaf
    content_type: text/plain
    targets: leafs
    transformation: leaf
    parameters:
      device: name__value
  - name: openconfig_leaf_config
    artifact_name: openconfig-leaf
    content_type: application/json
    targets: leafs
    transformation: openconfig_leaf
    parameters:
      device: name__value
  - name: borderleaf_config
    artifact_name: border-leaf
    content_type: text/plain
    targets: border_leafs
    transformation: leaf
    parameters:
      device: name__value
  - name: spine_config
    artifact_name: spine
    content_type: text/plain
    targets: spines
    transformation: spine
    parameters:
      device: name__value
  - name: loadbalancer_config
    artifact_name: loadbalancer
    content_type: text/plain
    targets: loadbalancers
    transformation: loadbalancer
    parameters:
      device: name__value
  # Juniper Firewall
  - name: juniper_firewall_config
    artifact_name: juniper-firewall
    content_type: text/plain
    targets: juniper_firewall
    transformation: juniper_firewall
    parameters:
      device: name__value
  # Containerlab
  - name: Containerlab Topology
    artifact_name: containerlab-topology
    content_type: text/plain
    targets: topologies_clab
    transformation: topology_clab
    parameters:
      name: name__value
  - name: Cable matrix for Topology
    artifact_name: topology-cabling
    content_type: text/csv
    targets: topologies_dc
    transformation: topology_cabling
    parameters:
      name: name__value
  # Equinix POP
  - name: equinix_pop_config
    artifact_name: equinix_pop
    content_type: text/plain
    targets: equinix_pop
    transformation: equinix_pop
    parameters:
      name: name__value
  # Rack elevation
  - name: rack_elevation
    artifact_name: rack_elevation
    content_type: image/svg+xml
    targets: racks
    transformation: rack_elevation
    parameters:
      name: name__value
  # Proxmox
  - name: proxmox_vm_config
    artifact_name: proxmox-vm
    content_type: text/plain
    targets: proxmox_vms
    transformation: proxmox_vm_config
    parameters:
      name: name__value
  - name: vm_userdata
    artifact_name: vm-userdata
    content_type: application/yaml
    targets: vm_userdata_targets
    transformation: vm_userdata
    parameters:
      name: name__value
  # KVM
  - name: kvm_vm_config
    artifact_name: kvm-vm
    content_type: text/plain
    targets: kvm_vms
    transformation: kvm_vm_config
    parameters:
      name: name__value
  # Hyper-V
  - name: hyperv_vm_config
    artifact_name: hyperv-vm
    content_type: text/plain
    targets: hyperv_vms
    transformation: hyperv_vm_config
    parameters:
      name: name__value
  # ESXi
  - name: esxi_vm_config
    artifact_name: esxi-vm
    content_type: text/plain
    targets: esxi_vms
    transformation: esxi_vm_config
    parameters:
      name: name__value

check_definitions:
  - name: validate_spine
    class_name: CheckSpine
    file_path: checks/spine.py
    targets: spines
    parameters:
      device: name__value
  - name: validate_leaf
    class_name: CheckLeaf
    file_path: checks/leaf.py
    targets: leafs
    parameters:
      device: name__value
  - name: validate_edge
    class_name: CheckEdge
    file_path: checks/edge.py
    targets: edges
    parameters:
      device: name__value
  - name: validate_loadbalancer
    class_name: CheckLoadBalancer
    file_path: checks/loadbalancer.py
    targets: loadbalancers
    parameters:
      device: name__value
  - name: validate_virtualization_vm
    class_name: CheckVirtualizationVM
    file_path: checks/virtualization_vm.py
    targets: virtualization_vms
    parameters:
      device: name__value
  - name: validate_virtualization_host
    class_name: CheckVirtualizationHost
    file_path: checks/virtualization_host.py
    targets: virtualization_hosts
    parameters:
      device: name__value

# `watch` lists the files a component depends on that Infrahub cannot detect by reading the entry
# point: helper modules imported at runtime, and Jinja templates chosen from device data rather than
# named in the source. Without it, editing `transforms/common.py` or a platform template leaves the
# rendered artifacts stale, because nothing tells Infrahub the artifact needs regenerating.
python_transforms:
  - name: rack_elevation
    class_name: RackElevationTransform
    file_path: transforms/rack_elevation.py
    # Loader points at the directory and the template is named at call time.
    watch:
      files:
        - templates/visualization/rack_elevation.svg.j2
  - name: topology_cabling
    class_name: TopologyCabling
    file_path: transforms/topology_cabling.py
  - name: leaf
    class_name: Leaf
    file_path: transforms/leaf.py
    # The template is `{netmiko_device_type}.j2`, resolved from the device's platform, so the whole
    # directory is the dependency -- adding a platform template changes the output for that platform.
    watch:
      files:
        - transforms/common.py
        - templates/configs/leafs
  - name: openconfig_leaf
    class_name: OpenConfigLeaf
    file_path: transforms/openconfig_leaf.py
  - name: spine
    class_name: Spine
    file_path: transforms/spine.py
    watch:
      files:
        - transforms/common.py
        - templates/configs/spines
  - name: loadbalancer
    class_name: LoadBalancer
    file_path: transforms/loadbalancer.py
    watch:
      files:
        - transforms/common.py
        - templates/configs/loadbalancers
  - name: edge
    class_name: Edge
    file_path: transforms/edge.py
    watch:
      files:
        - transforms/common.py
        - templates/configs/edges
  - name: equinix_pop
    class_name: EquinixPOP
    file_path: transforms/equinix_pop.py
    watch:
      files:
        - transforms/common.py
        - templates/configs/equinix
  - name: juniper_firewall
    class_name: JuniperFirewall
    file_path: transforms/juniper_firewall.py
    watch:
      files:
        - templates/configs/juniper_firewall.j2

generator_definitions:
  # All three generators subclass `TopologyCreator` from `generators/common.py`, which in turn imports
  # `generators/schema_protocols.py`. Neither is reachable from the entry point Infrahub reads.
  - name: create_dc
    file_path: generators/generate_dc.py
    targets: topologies_dc
    query: topology_dc
    class_name: DCTopologyGenerator
    parameters:
      name: name__value
    watch:
      files:
        - generators/common.py
        - generators/schema_protocols.py
  - name: create_pop
    file_path: generators/generate_pop.py
    targets: topologies_pop
    query: topology_pop
    class_name: PopTopologyGenerator
    parameters:
      name: name__value
    watch:
      files:
        - generators/common.py
        - generators/schema_protocols.py
  - name: create_segment
    file_path: generators/generate_segment.py
    targets: network_segments
    query: segment
    class_name: NetworkSegmentGenerator
    parameters:
      name: name__value
    watch:
      files:
        - generators/common.py
        - generators/schema_protocols.py
  # The virtualization generators import `clean_data` from `generators/common.py`,
  # which imports `generators/schema_protocols.py`. Same invisible-dependency
  # problem as the topology generators above.
  - name: cable_virtualization_host
    file_path: generators/generate_virtualization_cabling.py
    targets: virtualization_hosts
    query: virtualization_host_cabling
    class_name: VirtualizationHostCablingGenerator
    parameters:
      name: name__value
    watch:
      files:
        - generators/common.py
        - generators/schema_protocols.py
  - name: secure_virtualization_vm
    file_path: generators/generate_virtualization_vm_security.py
    targets: virtualization_vms
    query: virtualization_vm_security
    class_name: VirtualizationVMSecurityGenerator
    parameters:
      name: name__value
    watch:
      files:
        - generators/common.py
        - generators/schema_protocols.py
  - name: assign_vm_artifact_groups
    file_path: generators/generate_vm_artifact_groups.py
    targets: virtualization_vms
    query: vm_artifact_groups
    class_name: VMArtifactGroupsGenerator
    parameters:
      name: name__value
    watch:
      files:
        - generators/common.py
        - generators/schema_protocols.py
  - name: attach_dc_firewall_policy
    file_path: generators/generate_dc_firewall_policy.py
    targets: dc_firewall_policy_targets
    query: dc_firewall_policy
    class_name: DcFirewallPolicyGenerator
    parameters:
      device: name__value
    watch:
      files:
        - generators/common.py
        - generators/schema_protocols.py

