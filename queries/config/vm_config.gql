query vm_config($name: String!) {
  VirtualizationVirtualMachine(name__value: $name) {
    edges {
      node {
        name {
          value
        }
        description {
          value
        }
        status {
          value
        }
        os_version {
          value
        }
        vmid {
          value
        }
        vcpus {
          value
        }
        memory {
          value
        }
        disk {
          value
        }
        ssh_public_key {
          value
        }
        host {
          node {
            ... on VirtualizationPhysicalHost {
              name {
                value
              }
            }
          }
        }
        cluster {
          node {
            name {
              value
            }
            hypervisor_type {
              node {
                name {
                  value
                }
                image_prefix {
                  value
                }
              }
            }
          }
        }
        platform {
          node {
            name {
              value
            }
          }
        }
        primary_address {
          node {
            address {
              value
            }
          }
        }
        tags {
          edges {
            node {
              name {
                value
              }
            }
          }
        }
      }
    }
  }
}
