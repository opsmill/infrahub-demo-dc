query virtualization_host_cabling($name: String!) {
  VirtualizationPhysicalHost(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        location {
          node {
            __typename
          }
        }
        interfaces {
          edges {
            node {
              id
              name {
                value
              }
              role {
                value
              }
              status {
                value
              }
              ... on InterfacePhysical {
                connector {
                  node {
                    id
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
