[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infrahub-demo-dc"
version = "1.0.1"
description = "Design driven automation with Infrahub"
readme = "README.md"
authors = [
    {name = "Tomek Zajac", email = "tomek@mastuazi.com"},
    {name = "Pete Crocker", email = "pete@opsmill.com"},
]
requires-python = ">=3.11,<3.15"
dependencies = [
    # Floor, not a pin: uv.lock is committed and resolves exactly, so a run is reproducible either
    # way, and the difference is only who moves the version -- and the bump pull request is the
    # designated mover. No upper bound: a relock is the deliberate act, and a stale ceiling costs
    # more than it buys.
    "infrahub-sdk[all,ctl]>=1.23.0",
    "invoke>=2.2.1,<3.0.0",
    "rich>=13.9.4,<14.0.0",
]

[dependency-groups]
dev = [
    "infrahub-testcontainers>=1.11.0",
    "mypy>=2.3.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-dependency>=0.6.0",
    "pytest-order>=1.3.0",
    # Capped below 0.16, which formats Python inside markdown (17 files here today, 15 vendored).
    # ariadne-codegen already pins ruff>=0.15.0,<0.16.0 transitively; recording it locally keeps a
    # relock from crossing the boundary as a side effect. demo-sp's override-dependencies route is
    # the end state; lifting the cap must also fix tests/AGENTS.md's fenced Python first.
    "ruff>=0.15.0,<0.16.0",
    "rumdl>=0.2.55",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.32.0",
    "yamllint>=1.37.1",
    "j2lint>=1.2.0",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120
# extend-exclude, not exclude: an explicit `exclude` silently replaces ruff's default exclusions
# (build/, dist/, .git/ and friends would become lintable).
extend-exclude = [
    # Vendored or illustrative trees: ruff 0.16 formats Python inside markdown, and these carry
    # fenced code this repository does not author or deliberately leaves partial.
    ".agents/",
    ".dev/",
    "scratchpad/",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
pretty = true
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = ["scripts/debug/"]
# The Infrahub SDK returns union types for dynamically-resolved node attributes
# (e.g. node.attr returns Attribute | RelationshipManager | RelatedNode).
# At runtime the correct type is always resolved, but mypy cannot verify this.
disable_error_code = ["union-attr", "type-abstract"]

[[tool.mypy.overrides]]
module = ["untyped_package.*"]
follow_untyped_imports = true

[tool.rumdl.global]
disable = ["MD013", "MD029", "MD033", "MD041"]
exclude = [
    ".agents/",
    ".claude/",
    ".git/",
    ".kiro/",
    ".mypy_cache/",
    ".ruff_cache/",
    ".specify/",
    ".venv/",
    "docs/.docusaurus/",
    "docs/build/",
    "docs/node_modules/",
    "docs/README.md",
    "node_modules/",
    "scratchpad/",
]
respect-gitignore = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
# The repository root, so a unit test can import the transform and generator helpers
# it exercises (`from transforms.common import ...`) the same way Infrahub imports them.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "class"
filterwarnings = [
    "ignore:`background_execution` is deprecated:DeprecationWarning:infrahub_sdk.branch",
]
# The integration suite shares one Infrahub deployment across modules, which run in file-name order
# (test_00_..., test_10_..., ...). Do not reorder or randomise collection.
markers = [
    "core: workflows every pull request must keep working. Run with `-m 'not extended'`.",
    "extended: additional workflows run on Infrahub-version bump branches and on a tier=full manual dispatch, advisory (non-blocking) while the upstream group-member resolution fault is open. Adds ~30-40 minutes.",
    "offline: an integration-suite test that reads only repository files and needs no deployment.",
]
