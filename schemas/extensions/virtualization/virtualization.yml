# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
---
version: "1.0"

nodes:
  # --------------------  Hypervisor Type  --------------------
  # Everything that follows from "this is a Proxmox estate": the OS its hosts
  # run, the artifact group its VMs belong to, the transform that renders their
  # provisioning script, and how that script is written. Held as data so a new
  # hypervisor is a row here plus a template, rather than edits spread across
  # the schema, a generator constant, the Service Catalog and .infrahub.yml.
  - name: HypervisorType
    namespace: Virtualization
    description: A hypervisor family and the conventions that follow from it.
    label: Hypervisor Type
    icon: mdi:cog-box
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ label__value }}"
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        description: Key shared with VirtualizationCluster.cluster_type.
        kind: Text
        unique: true
        order_weight: 1000
      - name: label
        kind: Text
        optional: true
        order_weight: 1100
      - name: artifact_definition
        label: Artifact Definition
        description: Name of the artifact definition that renders a VM's provisioning script.
        kind: Text
        optional: true
        order_weight: 1200
      - name: script_language
        label: Script Language
        description: Language the provisioning script is written in, for syntax highlighting.
        kind: Dropdown
        optional: true
        order_weight: 1300
        choices:
          - name: bash
            label: Bash
            description: POSIX shell script.
            color: "#7ec8a0"
          - name: powershell
            label: PowerShell
            description: Windows PowerShell script.
            color: "#0078d4"
      - name: image_prefix
        label: Image Prefix
        description: Prefix of the template image a VM is cloned from, e.g. "tpl-" in tpl-ubuntu-24.04.
        kind: Text
        optional: true
        order_weight: 1400
      # How far this family is allowed to allocate beyond physical capacity,
      # as a percentage: 400 is 4:1, 100 is no overcommit. A percentage rather
      # than a ratio because Number is integer-only, so 1.5:1 has no spelling
      # as a ratio. validate_virtualization_capacity reads these, and treats a
      # missing value as 100.
      - name: vcpu_overcommit_percent
        label: vCPU Overcommit (%)
        description: Allocatable vCPUs as a percentage of physical cores. 400 means 4:1.
        kind: Number
        optional: true
        order_weight: 1500
        parameters:
          min_value: 100
      - name: memory_overcommit_percent
        label: Memory Overcommit (%)
        description: Allocatable memory as a percentage of installed memory. 100 means no overcommit.
        kind: Number
        optional: true
        order_weight: 1600
        parameters:
          min_value: 100
      - name: disk_overcommit_percent
        label: Disk Overcommit (%)
        description: Allocatable disk as a percentage of usable capacity. 150 means 1.5:1 thin provisioning.
        kind: Number
        optional: true
        order_weight: 1700
        parameters:
          min_value: 100
    relationships:
      - name: platform
        peer: DcimPlatform
        cardinality: one
        kind: Attribute
        optional: true
        description: Operating system the hosts of this hypervisor family run.
        order_weight: 2000
      - name: artifact_group
        label: Artifact Group
        peer: CoreStandardGroup
        cardinality: one
        kind: Attribute
        optional: true
        description: Group the VMs of this hypervisor family join, so artifacts can target them.
        order_weight: 2100
      - name: clusters
        peer: VirtualizationCluster
        cardinality: many
        kind: Attribute
        identifier: hypervisor_type__clusters
        optional: true
        order_weight: 2200
      - name: hosts
        peer: VirtualizationPhysicalHost
        cardinality: many
        kind: Attribute
        identifier: hypervisor_type__hosts
        optional: true
        order_weight: 2300

  # --------------------  Virtualization Cluster  --------------------
  - name: Cluster
    namespace: Virtualization
    description: A group of hypervisor hosts on which virtual machines run.
    label: Virtualization Cluster
    icon: mdi:layers-triple
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: "{{ name__value }}"
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        unique: true
        order_weight: 1000
      - name: description
        kind: Text
        optional: true
        order_weight: 1100
      - name: cluster_type
        label: Cluster Type
        kind: Dropdown
        optional: true
        order_weight: 1200
        choices:
          - name: vmware
            label: VMware vSphere
            description: VMware vSphere/ESXi cluster.
            color: "#7fbfff"
          - name: kvm
            label: KVM
            description: KVM/QEMU cluster.
            color: "#ff9900"
          - name: proxmox
            label: Proxmox VE
            description: Proxmox Virtual Environment cluster.
            color: "#e57000"
          - name: hyperv
            label: Hyper-V
            description: Microsoft Hyper-V cluster.
            color: "#0078d4"
          - name: other
            label: Other
            description: Other hypervisor cluster type.
            color: "#808080"
    relationships:
      - name: hypervisor_type
        label: Hypervisor Type
        peer: VirtualizationHypervisorType
        cardinality: one
        kind: Attribute
        identifier: hypervisor_type__clusters
        optional: true
        description: Hypervisor family this cluster runs.
        order_weight: 1250
      - name: hosts
        peer: VirtualizationPhysicalHost
        cardinality: many
        kind: Attribute
        optional: true
        description: Hypervisor hosts that are members of this cluster.
        order_weight: 2000
      - name: virtual_machines
        label: Virtual Machines
        peer: VirtualizationVirtualMachine
        cardinality: many
        kind: Attribute
        optional: true
        description: Virtual machines that belong to this cluster.
        order_weight: 2100

  # --------------------  Physical Host  --------------------
  - name: PhysicalHost
    namespace: Virtualization
    description: A physical server that hosts virtual machines via a hypervisor.
    label: Physical Host
    icon: mdi:server
    include_in_menu: false
    generate_template: true
    inherit_from:
      - CoreArtifactTarget
      - DcimGenericDevice
      - DcimPhysicalDevice
      - ComputeGenericUnit
      - VirtualizationHostVirtualMachine
    uniqueness_constraints:
      - [name__value]
    # Relationship pickers render the peer's display label, and they cannot be
    # filtered by another field's value, so the hypervisor family goes in the
    # label: picking hosts for a cluster shows "fra1-hv-01 (hyperv)" and a
    # mismatch is visible before it is saved.
    display_label: "{{ name__value }} ({{ hypervisor_type__name__value }})"
    attributes:
      # DcimDevice declares its own `role` with the network vocabulary (leaf,
      # spine, dc_firewall, ...) on the concrete node rather than on
      # DcimGenericDevice, so a host inherits no role at all. A server's roles
      # are a different vocabulary, declared here.
      - name: role
        kind: Dropdown
        optional: true
        order_weight: 1400
        choices:
          - name: hypervisor
            label: Hypervisor
            description: Server running a hypervisor that hosts virtual machines.
            color: "#7ec8a0"
          - name: compute
            label: Compute
            description: Server running a workload directly on the hardware, without a hypervisor.
            color: "#9fb8d4"
    relationships:
      # The host's hypervisor family, and with it the OS it runs: the
      # DcimGenericDevice `platform` is left unset on hosts, since a second
      # copy of the same fact is what lets a Windows host end up in a Proxmox
      # cluster. Both sides pointing at one HypervisorType turns compatibility
      # into an identity comparison instead of a platform/cluster_type matrix.
      - name: hypervisor_type
        label: Hypervisor Type
        peer: VirtualizationHypervisorType
        cardinality: one
        kind: Attribute
        identifier: hypervisor_type__hosts
        optional: true
        description: Hypervisor family this host runs.
        order_weight: 1140
      - name: cluster
        peer: VirtualizationCluster
        cardinality: one
        kind: Attribute
        optional: true
        description: Virtualization cluster this host is a member of.
        order_weight: 1150

  # --------------------  Virtual Machine  --------------------
  - name: VirtualMachine
    namespace: Virtualization
    description: A virtual machine hosted on a hypervisor.
    label: Virtual Machine
    icon: mdi:monitor
    include_in_menu: false
    inherit_from:
      - CoreArtifactTarget
      - DcimGenericDevice
      - ComputeGenericUnit
    uniqueness_constraints:
      - [name__value]
      # No [cluster, vmid__value] constraint. A VMID is only unique within its
      # cluster, so the pair looks like the right constraint, but the validator
      # counts an unset vmid as a value: only Proxmox and KVM VMs carry one, so
      # the second VMID-less Hyper-V or ESXi VM in a cluster would be rejected
      # with "Violates uniqueness constraint 'cluster-vmid'". Per-cluster VMID
      # collisions are caught in the Create VM form instead, from the
      # per-cluster used-ID map get_used_vmids() already returns.
    attributes:
      - name: vmid
        label: VM ID
        description: Numeric ID used by the hypervisor to identify this VM (e.g. Proxmox VMID).
        kind: Number
        optional: true
        order_weight: 1050
      - name: ssh_public_key
        label: SSH Public Key
        description: Public key installed into the guest by cloud-init / cloudbase-init.
        kind: Text
        optional: true
        order_weight: 1075
    relationships:
      - name: host
        peer: VirtualizationHostVirtualMachine
        cardinality: one
        kind: Parent
        identifier: host__virtual_machines
        optional: false
        description: Physical host running this virtual machine.
        order_weight: 1150
      - name: cluster
        peer: VirtualizationCluster
        cardinality: one
        kind: Attribute
        # Mandatory: every VM runs on a host that belongs to exactly one
        # cluster.
        optional: false
        description: Virtualization cluster this virtual machine belongs to.
        order_weight: 1200
      - name: customer
        peer: OrganizationCustomer
        cardinality: one
        kind: Attribute
        optional: true
        description: Customer that uses this virtual machine.
        order_weight: 1300

extensions:
  nodes:
    - kind: OrganizationCustomer
      relationships:
        - name: virtual_machines
          label: Virtual Machines
          peer: VirtualizationVirtualMachine
          cardinality: many
          kind: Attribute
          optional: true
          description: Virtual machines used by this customer.
          order_weight: 2600
