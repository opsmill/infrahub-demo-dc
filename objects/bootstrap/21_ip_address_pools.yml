---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPAddressPool
  data:
    - name: virtualization_vm_pool
      description: Address pool for virtualization VM primary addresses
      default_address_type: IpamIPAddress
      ip_namespace: default
      resources:
        kind: IpamPrefix
        data:
          # member_type: address (with is_pool left false) makes this prefix
          # eligible for individual address allocation - is_pool: true marks a
          # prefix as a CoreIPPrefixPool source for sub-prefix carving instead,
          # which breaks CoreIPAddressPool allocation (see 17_ip_prefix_pools.yml
          # for the prefix-pool variant).
          - prefix: 100.64.0.0/16
            description: Virtualization VM primary addresses (RFC 6598 shared space)
            status: active
            member_type: address

---
# Fabric-side addressing for hypervisor hosts.
#
# Unlike virtualization_vm_pool, this prefix is not a standalone island: it is
# the prefix of the hypervisor-management network segment
# (objects/segments/hypervisor-mgmt-dc-arista.yml), so the leaf pair renders an
# anycast gateway for it and a host address is actually reachable. The segment
# references this same prefix by value rather than creating its own.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    - prefix: 172.25.9.0/24
      description: Hypervisor host management network (fabric VLAN 900)
      status: active
      role: management
      member_type: address

---
# The gateway the leaf renders, materialised so the address pool cannot hand
# .1 to a host: allocation takes the next free address in the prefix, and an
# address that exists is not free. transforms/common.get_anycast_gateway
# derives the same value from the prefix, so the two stay in step.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamIPAddress
  data:
    - address: 172.25.9.1/24
      description: Anycast gateway for the hypervisor management segment, configured on the leaf pair

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPAddressPool
  data:
    - name: virtualization_host_pool
      description: Address pool for hypervisor host management addresses
      default_address_type: IpamIPAddress
      ip_namespace: default
      resources:
        kind: IpamPrefix
        data:
          - prefix: 172.25.9.0/24
