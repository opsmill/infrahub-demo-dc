# Cluster templates and VM sizing profiles. The host templates live with the
# other hardware in 10_physical_device_templates.yml, since they carry a
# server model and its ports; these two kinds have no hardware, so they live
# here, after the hypervisor types (07) they reference.
#
# Cluster templates carry the hypervisor family. A cluster has no capacity of
# its own - that is the sum of its hosts - so there is nothing to size: one
# template per family, and creating a cluster is a name plus a family pick.
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: TemplateVirtualizationCluster
  data:
    - template_name: VIRTUALIZATION_CLUSTER_PROXMOX
      description: Proxmox VE cluster
      hypervisor_type: proxmox
    - template_name: VIRTUALIZATION_CLUSTER_KVM
      description: KVM cluster
      hypervisor_type: kvm
    - template_name: VIRTUALIZATION_CLUSTER_VMWARE
      description: VMware vSphere cluster
      hypervisor_type: vmware
    - template_name: VIRTUALIZATION_CLUSTER_HYPERV
      description: Microsoft Hyper-V cluster
      hypervisor_type: hyperv

# VM t-shirt sizes, 1:4 vCPU-to-memory like the demo's own workloads. Profiles
# rather than templates because a VM's `host` is a mandatory Parent
# relationship, which a template object may not leave unset - a size template
# would have to name a host. A profile carries only the three compute values,
# and a size is a starting point, not a contract: an explicit value on the VM
# overrides it (fra1-vm-db01 takes LARGE with a bigger disk). No platform or
# status here - the guest OS and lifecycle are orthogonal to the size.
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ProfileVirtualizationVirtualMachine
  data:
    - profile_name: VIRTUALIZATION_VM_SMALL
      vcpus: 2
      memory: 8
      disk: 40
    - profile_name: VIRTUALIZATION_VM_MEDIUM
      vcpus: 4
      memory: 16
      disk: 100
    - profile_name: VIRTUALIZATION_VM_LARGE
      vcpus: 8
      memory: 32
      disk: 250
    - profile_name: VIRTUALIZATION_VM_XLARGE
      vcpus: 16
      memory: 64
      disk: 500
