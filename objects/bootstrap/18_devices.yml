---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityFirewall
  data:
    - name: corp-firewall
      role: edge_firewall
      device_type: [Juniper, SRX-1500]
      platform: [Juniper, JunOS]
      location: par-1
      status: active
      member_of_groups:
        - juniper_firewall
        - firewalls
      interfaces:
        kind: InterfacePhysical
        data:
          - name: fxp0
            role: management
            status: active
          - name: ge-0/0/0
            role: leaf
            status: active
          - name: ge-0/0/1
            role: leaf
            status: active
          - name: ge-0/0/2
            role: leaf
            status: active
          - name: ge-0/0/3
            role: leaf
            status: active

    # Second vendor on the same security policy. `corporate-firewall-policy` is attached to both this
    # device and `corp-firewall`, so one set of modelled rules renders as JunOS on one and as PAN-OS
    # `set` commands on the other -- which is the point of holding policy as data rather than as
    # vendor configuration.
    - name: dc1-pan-fw-01
      role: dc_firewall
      device_type: [Palo Alto Networks, PA-5220]
      platform: [Palo Alto Networks, PAN-OS]
      location: par-1
      status: active
      member_of_groups:
        - palo_alto_firewall
        - firewalls
      interfaces:
        kind: InterfacePhysical
        data:
          - name: management
            role: management
            status: active
          - name: ethernet1/1
            role: uplink
            status: active
          - name: ethernet1/2
            role: leaf
            status: active
          - name: ethernet1/3
            role: leaf
            status: active
          - name: ethernet1/4
            role: leaf
            status: active

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimDevice
  data:
    - name: cisco-switch-01
      role: leaf
      device_type: [Cisco, N9K-C93108TC-FX]
      platform: [Cisco, NX-OS]
      location: lon-1
      status: active
      member_of_groups:
        - leafs
      interfaces:
        kind: InterfacePhysical
        parameters:
          expand_range: true
        data:
          - name: mgmt0
            role: management
            status: active
          - name: Ethernet1/[1-4]
            role: customer
            status: active

    - name: juniper-switch-01
      role: spine
      device_type: [Juniper, QFX5220-32CD]
      platform: [Juniper, JunOS]
      location: fra-1
      status: active
      member_of_groups:
        - spines
      interfaces:
        kind: InterfacePhysical
        parameters:
          expand_range: true
        data:
          - name: fxp0
            role: management
            status: active
          - name: et-0/0/[0-3]
            role: leaf
            status: active

    - name: arista-switch-01
      role: spine
      device_type: [Arista, DCS-7280DR3-24-F]
      platform: [Arista, EOS]
      location: bcn-1
      status: active
      member_of_groups:
        - spines
      interfaces:
        kind: InterfacePhysical
        parameters:
          expand_range: true
        data:
          - name: Management1
            role: management
            status: active
          - name: Ethernet[1-4]
            role: leaf
            status: active

    - name: edgecore-switch-01
      role: leaf
      device_type: [Edgecore, 5912-54X-O-AC-F]
      platform: [Generic, Sonic OS]
      location: chi-1
      status: active
      member_of_groups:
        - leafs
      interfaces:
        kind: InterfacePhysical
        data:
          - name: eth0
            role: management
            status: active
          - name: Ethernet0
            role: customer
            status: active
          - name: Ethernet4
            role: customer
            status: active
          - name: Ethernet8
            role: customer
            status: active
          - name: Ethernet12
            role: customer
            status: active
