---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ServiceNetworkSegment
  data:
    - customer_name: OpsMill
      environment: production
      segment_type: l2_only
      tenant_isolation: customer_dedicated
      vlan_id: 500
      external_routing: false
      status: active
      owner: OpsMill
      deployment: dc-arista
      prefix:
        data:
          prefix: 172.25.1.0/24
          status: active
          role: customer
      # Required, not decorative: `create_segment` targets the `network_segments` group, and the
      # segment-on-create trigger rule refuses to run a generator against a node that is not a
      # member of its target group.
      member_of_groups:
        - network_segments
