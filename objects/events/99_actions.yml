---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNodeTriggerRule
  data:
    - name: dc-on-create
      description: Trigger on create of DC
      node_kind: TopologyDataCenter
      mutation_action: created
      action: dc
      branch_scope: other_branches
    - name: pop-on-create
      description: Trigger on create of POP
      node_kind: TopologyColocationCenter
      mutation_action: created
      action: pop
      branch_scope: other_branches
    - name: segment-on-create
      description: Trigger on create of Network Segment
      node_kind: ServiceNetworkSegment
      mutation_action: created
      action: segment
      branch_scope: other_branches
    - name: virtualization-host-on-create
      description: Trigger cabling on create of a Virtualization Physical Host
      node_kind: VirtualizationPhysicalHost
      mutation_action: created
      action: virtualization_host_cabling
      branch_scope: other_branches
    - name: virtualization-vm-on-create
      description: Trigger HTTPS-only security setup on create of a Virtualization Virtual Machine
      node_kind: VirtualizationVirtualMachine
      mutation_action: created
      action: virtualization_vm_security
      branch_scope: other_branches
