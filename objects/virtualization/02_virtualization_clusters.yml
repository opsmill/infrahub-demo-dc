# Virtualization Clusters - independent of any specific DC design
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: VirtualizationCluster
  data:
    - name: "FRA1-PROXMOX-CLUSTER"
      description: "Proxmox VE cluster in Frankfurt"
      hypervisor_type: proxmox
      hosts:
        - fra1-pve-01
        - fra1-pve-02

    - name: "FRA1-KVM-CLUSTER"
      description: "KVM cluster in Frankfurt"
      hypervisor_type: kvm
      hosts:
        - fra1-kvm-01
        - fra1-kvm-02

    - name: "FRA1-ESXI-CLUSTER"
      description: "VMware ESXi cluster in Frankfurt"
      hypervisor_type: vmware
      hosts:
        - fra1-esx-01

    - name: "FRA1-HYPERV-CLUSTER"
      description: "Microsoft Hyper-V cluster in Frankfurt"
      hypervisor_type: hyperv
      hosts:
        - fra1-hv-01
