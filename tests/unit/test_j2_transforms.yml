---
version: "1.0"
infrahub_tests:
  # --------------------  Jinja2Transform  --------------------
  - resource: Jinja2Transform
    resource_name: topology_clab
    tests:
      - name: syntax_check
        spec:
          kind: jinja2-transform-smoke
      - name: baseline
        expect: PASS
        spec:
          kind: "jinja2-transform-unit-render"
          directory: simulators

  - resource: Jinja2Transform
    resource_name: proxmox_vm_config
    tests:
      - name: syntax_check
        spec:
          kind: jinja2-transform-smoke
      - name: renders_allocated_ip_and_vmid
        expect: PASS
        spec:
          kind: "jinja2-transform-unit-render"
          directory: proxmox_vm
          output: output.txt
      - name: missing_vmid_fails_loudly
        expect: PASS
        spec:
          kind: "jinja2-transform-unit-render"
          directory: proxmox_vm_no_vmid
          output: output.txt

  - resource: Jinja2Transform
    resource_name: vm_userdata
    tests:
      - name: syntax_check
        spec:
          kind: jinja2-transform-smoke
      - name: linux_cloud_init
        expect: PASS
        spec:
          kind: "jinja2-transform-unit-render"
          directory: vm_userdata_linux
          output: output.txt
      - name: windows_cloudbase_init
        expect: PASS
        spec:
          kind: "jinja2-transform-unit-render"
          directory: vm_userdata_windows
          output: output.txt
