        spec:
          path: queries/config/proxmox_vm.gql
          kind: graphql-query-smoke

  - resource: GraphQLQuery
    resource_name: virtualization_vm_validation
    tests:
      - name: syntax_check
        spec:
          path: queries/validation/virtualization_vm.gql
          kind: graphql-query-smoke
