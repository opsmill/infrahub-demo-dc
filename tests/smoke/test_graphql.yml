---
# Syntax checks for every query registered in .infrahub.yml. These run through the Infrahub SDK's
# pytest plugin and need no running instance, so they are the cheapest way to catch a malformed query.
#
# Executing the same queries against a live schema -- which is what catches a renamed attribute or a
# changed relationship -- is covered by tests/integration/test_30_graphql.py.
#
# Keep this list in step with the `queries` section of .infrahub.yml. The integration suite fails if
# the two drift apart.
version: "1.0"
infrahub_tests:
  # --------------------  Topology  --------------------
  - resource: GraphQLQuery
    resource_name: topology_dc
    tests:
      - name: syntax_check
        spec:
          path: queries/topology/dc.gql
          kind: graphql-query-smoke

  - resource: GraphQLQuery
    resource_name: topology_pop
    tests:
      - name: syntax_check
        spec:
          path: queries/topology/pop.gql
          kind: graphql-query-smoke

  - resource: GraphQLQuery
    resource_name: topology_simulator
    tests:
      - name: syntax_check
        spec:
          path: queries/topology/clab.gql
          kind: graphql-query-smoke

  - resource: GraphQLQuery
    resource_name: topology_cabling
