---
version: "1.0"
infrahub_tests:
  # --------------------  GraphQLQuery  --------------------
  - resource: GraphQLQuery
    resource_name: topology_dc
    tests:
      - name: syntax_check
        spec:
          path: queries/topology/dc.gql
          kind: graphql-query-smoke

  - resource: GraphQLQuery
    resource_name: topology_pop
    tests:
      - name: syntax_check
        spec:
          path: queries/topology/pop.gql
          kind: graphql-query-smoke

  - resource: GraphQLQuery
    resource_name: topology_simulator
    tests:
      - name: syntax_check
        spec:
          path: queries/topology/clab.gql
          kind: graphql-query-smoke

  - resource: GraphQLQuery
    resource_name: leaf_config
    tests:
      - name: syntax_check
        spec:
          path: queries/config/leaf.gql
          kind: graphql-query-smoke

  - resource: GraphQLQuery
    resource_name: spine_config
    tests:
      - name: syntax_check
        spec:
          path: queries/config/spine.gql
          kind: graphql-query-smoke

  - resource: GraphQLQuery
    resource_name: virtualization_host_cabling
